<!doctype html>

<html>
  <head>
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <link rel="stylesheet" href="styles/style.css" />
    <title>Mochi Cat Mic Test</title>
  </head>
  <body>
    <header>
      <h2>Let me test your mic with my cat, Mochi!</h2>
    </header>

    <main>
      <center>
        <div>
          <img id="cat" class="catClass" src="img/normal1.jpg" />
        </div>
      </center>
    </main>

    <footer class="levelHeaderClass">
      <div class="levelHeaderClassDiv">
        <h4 id="levelHeader" class="levelHeaderPosClass">Microphone Log...</h4>

        <button
          id="calibrateButton"
          class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full"
          onclick="calibrate()"
        >
          Calibrate
        </button>

        <button
          id="recordButton"
          class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-full"
          onclick="record()"
        >
          Record Mic
        </button>

        <button
          id="recordNameChangeButton"
          class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-full"
          onclick="changeRecordName()"
        >
          Change Rec Name
        </button>
      </div>
    </footer>

    <script src="scripts/script.js"></script>
  </body>
</html>
