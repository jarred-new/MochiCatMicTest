<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>Mochi Mic Loudness Checker</title>
</head>
<body>
  <header>
    <h2>
      Let me test your mic with my cat!
    </h2>
  </header>
  
  <main>
    <center>
      <div>
        <img id="cat" class="catClass" src="img/normal1.jpg">
      </div>
    </center>
  </main>
  
  <footer class="levelHeaderClass">
    <div>
      <h4 id="levelHeader">
        Microphone Log...
      </h4>
      
      <button 
        id="calibrateButton" 
        class="calibrateButtonClass"
        onclick="calibrate();">
        Calibrate
      </button>
    </div>
  </footer>
  
  <script src="scripts/script.js"></script>
</body>
</html>
